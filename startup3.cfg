#!/bin/bash

# --- THE FIX: WAIT FOR APT LOCKS ---
# This loop checks if the apt database is locked. 
# If it is, it waits 5 seconds and checks again.
echo "Checking for apt locks..."
while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
  echo "Waiting for other software managers to finish..."
  sleep 5
done

echo "Apt is free. Proceeding..."

# 1. Update and install packages
apt-get update
apt-get install -y nginx git

# 2. Create the index.html
# Ensure the directory exists just in case (good safety measure)
mkdir -p /var/www/html

cat <<EOF > /var/www/html/index.html
<!doctype html>
<html>
    <head>
        <title>GCP GCE Demo</title>
    </head>
    <body>
        <h1>Hallo Ruesselsheim :-)</h1>
        <h2>Hostname: $(hostname) </h2>
        <h3>Das ist ein sehr statisches Beispiel</h3>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/5hhdjWHm9Vk" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </body>
</html>
EOF

# 3. Restart nginx
systemctl restart nginx